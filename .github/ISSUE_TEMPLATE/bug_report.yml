name: Bug report
description: Report a problem with the SimonsVoss MobileKey integration.
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >-
        Thank you for taking the time to report a bug. The diagnostics file
        makes most problems much easier to understand, please attach it
        whenever possible. Security vulnerabilities must not be reported
        here: use the private reporting channel described in `SECURITY.md`.
  - type: input
    id: integration_version
    attributes:
      label: Integration version
      description: >-
        Shown in HACS, or in the `version` field of
        `custom_components/simonsvoss_mobilekey/manifest.json`.
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      description: Shown in **Settings → About**.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What happened, and what did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to…
        2. Press…
        3. See the error…
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics file
      placeholder: Drag and drop the diagnostics file here. Do not paste its content.
      description: >-
        **Settings → Devices & services → SimonsVoss MobileKey → ⋮ → Download
        diagnostics** for the whole account, or **⋮ → Download diagnostics**
        on the page of the affected device. Passwords, email addresses, PIN
        codes, the names of guest keys and key holders and hardware
        identifiers are redacted automatically, including inside the raw
        cloud payloads. Home Assistant names a device file after the device:
        rename the file of a guest key or of a key holder before attaching
        it. Review the file before attaching it anyway.
  - type: textarea
    id: logs
    attributes:
      label: Debug logs
      description: >-
        Enable debug logging (**⋮ → Enable debug logging** on the integration
        page, or the `logger` configuration described in the README),
        reproduce the problem and paste the relevant log lines here.
      render: Text
  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I am running the latest version of the integration.
          required: true
        - label: I have searched the existing issues and this problem has not been reported yet.
          required: true
        - label: I have reviewed any attached file for personal data.
          required: true
