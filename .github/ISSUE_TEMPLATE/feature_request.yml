name: Feature request
description: Suggest an improvement for the SimonsVoss MobileKey integration.
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: >-
        Thank you for suggesting an improvement. A device type the
        integration skips with a `Skipping unsupported …` log warning has its
        own **Unsupported device** template, please use it instead.
  - type: textarea
    id: description
    attributes:
      label: Describe the feature
      description: What should the integration do?
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: >-
        How would you use this feature? How does the official MobileKey
        application behave for it, if applicable?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: >-
        Screenshots, a diagnostics file or anything else that helps. The
        diagnostics file is redacted automatically; review it before
        attaching it anyway, and rename a device file named after a guest
        key or a key holder.
  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I have searched the existing issues and this feature has not been requested yet.
          required: true
        - label: I have reviewed any attached file for personal data.
          required: true
